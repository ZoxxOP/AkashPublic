version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "ZoxxOP"
    reviewers:
      - "ZoxxOP"
    commit-message:
      prefix: "pip"
      include: "scope"
    
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "ZoxxOP"
    reviewers:
      - "ZoxxOP"
    commit-message:
      prefix: "github-actions"
      include: "scope"
    
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "ZoxxOP"
    reviewers:
      - "ZoxxOP"
    commit-message:
      prefix: "docker"
      include: "scope"
